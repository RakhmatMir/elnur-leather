<body class="land" data-page="landing" data-langs="uz,ru">

<header class="lbar" id="lbar">
  <a class="llogo" href="#hero" aria-label="El-Nur Leathercraft"><b>El-Nur</b><span>Leathercraft</span></a>
  <nav class="lnav" aria-label="Menu">
    <a href="#belt" data-t="L.n1"></a><a href="#picks" data-t="L.n2"></a><a href="#build" data-t="L.n3"></a><a href="#menu" data-t="L.n4"></a><a href="#visit" data-t="L.n5"></a>

</header>

<div class="loader" id="loader" aria-hidden="true"><div class="loader-mark"><b>El-Nur</b><span>Leathercraft</span></div><div class="loader-bar"><i></i></div></div>
<div class="sbg" id="sbg" aria-hidden="true"><div class="sbg-wrap" id="sbgWrap"></div></div>
<nav class="dots" id="dots" aria-label="Ekranlar"></nav>
<div class="wipe" id="wipe" aria-hidden="true"><b id="wipeName"></b></div>

<main class="screens">

<!-- 1. Первый экран: мозаика фото + крупное имя -->
<section class="scr hero" id="hero" data-name="El-Nur">
  <div class="mosaic" aria-hidden="true">
    <div class="col c1"><img src="img/belt.jpg" alt=""><img src="img/strap-croco.jpg" alt=""><img src="img/table.jpg" alt=""><img src="img/belt.jpg" alt=""><img src="img/strap-croco.jpg" alt=""></div>
    <div class="col c2"><img src="img/master.jpg" alt=""><img src="img/strap-olive.jpg" alt=""><img src="img/strap-suede.jpg" alt=""><img src="img/master.jpg" alt=""><img src="img/strap-olive.jpg" alt=""></div>
    <div class="col c3"><img src="img/emboss.jpg" alt=""><img src="img/strap-nature.jpg" alt=""><img src="img/hat-detail.jpg" alt=""><img src="img/emboss.jpg" alt=""><img src="img/strap-nature.jpg" alt=""></div>
    <div class="col c4"><img src="img/shop.jpg" alt=""><img src="img/strap-black.jpg" alt=""><img src="img/strap-matte.jpg" alt=""><img src="img/shop.jpg" alt=""><img src="img/strap-black.jpg" alt=""></div>
  </div>
  <div class="hero-in">
    <p class="kick" data-t="L.kick"></p>
    <h1 class="name" aria-label="El-Nur Leathercraft"><span class="w"><i>E</i><i>l</i><i>-</i><i>N</i><i>u</i><i>r</i></span><em>Leathercraft</em></h1>
    <p class="tag" data-t="L.tag"></p>
    <div class="ctas"><a class="btn btn-light" href="#build" data-t="L.c1"></a><a class="btn btn-line-dark" data-link="tg" href="#" data-t="L.c2"></a></div>
  </div>
</section>

<!-- 2. Манифест + бегущая строка -->
<section class="scr manifest" id="manifest" data-name="Usta">
  <img class="bg" src="img/master.jpg" alt="" aria-hidden="true">
  <div class="man-in"><p class="man" data-t="L.man"></p></div>
  <div class="ticker" aria-hidden="true"><div class="tk"><span data-t="L.tick"></span><span data-t="L.tick"></span><span data-t="L.tick"></span><span data-t="L.tick"></span></div></div>
</section>

<!-- 3. Ремень по слоям -->
<section class="scr belt" id="belt" data-name="Kamar">
  <img class="bg" src="img/belt.jpg" alt="" aria-hidden="true">
  <div class="belt-in">
    <p class="kick" data-t="L.xk"></p>
    <h2 data-t="L.xh"></h2>
    <div class="xray">
      <div class="xbox">
      <svg class="xsvg" viewBox="0 0 640 520" role="img" aria-label="Kamar qatlamlari">
        <g class="ly ly1"><rect x="272" y="20" width="96" height="76" rx="14" fill="none" stroke="#C9CFAE" stroke-width="12"/><rect x="314" y="32" width="12" height="52" rx="6" fill="#C9CFAE"/></g>
        <g class="ly ly2"><rect x="300" y="128" width="40" height="64" rx="8" fill="none" stroke="#B9763F" stroke-width="10"/></g>
        <g class="ly ly3"><rect x="60" y="230" width="520" height="64" rx="32" fill="#9A5A2E"/><rect x="60" y="230" width="520" height="22" rx="11" fill="#B06C38" opacity=".55"/><circle cx="470" cy="262" r="6" fill="#5B341A"/><circle cx="500" cy="262" r="6" fill="#5B341A"/><circle cx="530" cy="262" r="6" fill="#5B341A"/></g>
        <g class="ly ly4"><rect x="76" y="346" width="488" height="36" rx="18" fill="none" stroke="#E8DFC8" stroke-width="3" stroke-dasharray="12 9"/></g>
        <g class="ly ly5"><text x="320" y="470" text-anchor="middle" font-family="Lora,serif" font-size="44" letter-spacing="10" fill="#E8DFC8">A · Z · I · Z</text></g>
      </svg>
      <div class="xl xl1"><i></i><div><b data-t="L.x1"></b><span data-t="L.x1s"></span></div></div>
      <div class="xl xl2 left"><i></i><div><b data-t="L.x2"></b><span data-t="L.x2s"></span></div></div>
      <div class="xl xl3"><i></i><div><b data-t="L.x3"></b><span data-t="L.x3s"></span></div></div>
      <div class="xl xl4 left"><i></i><div><b data-t="L.x4"></b><span data-t="L.x4s"></span></div></div>
      <div class="xl xl5"><i></i><div><b data-t="L.x5"></b><span data-t="L.x5s"></span></div></div>
      </div>
    </div>
    <p class="xcap" data-t="L.xcap"></p>
  </div>
</section>

<!-- 4. Популярное: карусель -->
<section class="scr picks" id="picks" data-name="Tasmalar">
  <img class="bg" src="img/strap-black.jpg" alt="" aria-hidden="true">
  <div class="picks-in">
    <div class="picks-head">
      <div><p class="kick" data-t="L.pk"></p><h2 data-t="L.ph"></h2></div>
      <div class="arrows"><button type="button" class="arr" data-dir="-1" aria-label="Orqaga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button type="button" class="arr" data-dir="1" aria-label="Oldinga"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </div>
    <ul class="track" id="track">
      <li><img src="img/strap-croco.jpg" alt="" loading="lazy"><b data-t="s.croco"></b><span data-t="c.p1"></span></li>
      <li class="lo"><img src="img/belt.jpg" alt="" loading="lazy"><b data-t="c.2"></b><span data-t="L.ask"></span></li>
      <li><img src="img/strap-suede.jpg" alt="" loading="lazy"><b data-t="s.suede"></b><span data-t="c.p1"></span></li>
      <li class="lo"><img src="img/hat-detail.jpg" alt="" loading="lazy"><b data-t="cap.hat"></b><span data-t="c.p5"></span></li>
      <li><img src="img/strap-nature.jpg" alt="" loading="lazy"><b data-t="s.nature"></b><span data-t="c.p1"></span></li>
      <li class="lo"><img src="img/emboss.jpg" alt="" loading="lazy"><b data-t="cap.emboss"></b><span data-t="L.ask"></span></li>
      <li><img src="img/strap-black.jpg" alt="" loading="lazy"><b data-t="s.black"></b><span data-t="c.p1"></span></li>
      <li class="lo"><img src="img/strap-matte.jpg" alt="" loading="lazy"><b data-t="s.matte"></b><span data-t="c.p1"></span></li>
    </ul>
  </div>
</section>

<!-- 5. Конструктор -->
<section class="scr build" id="build" data-name="Yigʻish">
  <div class="build-in">
    <div class="build-text">
      <p class="kick" data-t="L.bk"></p>
      <h2 data-t="L.bh"></h2>
      <p data-t="L.bt"></p>
    </div>
    <div class="builder" id="mini" aria-label="Konstruktor">
      <div class="stage">
        <div class="stage-top"><b data-t="b.title"></b></div>
        <svg id="art" class="art" viewBox="0 0 520 240" role="img" aria-label=""></svg>
        <div><div class="chips" id="chips"></div><p class="disclaimer" data-t="b.disc"></p></div>
      </div>
      <div class="controls" data-step="1">
        <div class="btabs" role="tablist"><button type="button" role="tab" data-st="1" aria-selected="true"><i>1</i><span data-t="L.t1"></span></button><button type="button" role="tab" data-st="2" aria-selected="false"><i>2</i><span data-t="L.t2"></span></button><button type="button" role="tab" data-st="3" aria-selected="false"><i>3</i><span data-t="L.t3"></span></button></div>
        <div data-g="1"><p class="ctl-label" data-t="b.item"></p><div class="items" id="items"></div></div>
        <div data-g="2"><p class="ctl-label"><span class="k" data-t="b.leather"></span>: <span id="leatherName"></span></p><div class="swatches" id="leather"></div></div>
        <div data-g="2"><p class="ctl-label"><span class="k" data-t="b.thread"></span>: <span id="threadName"></span></p><div class="swatches" id="thread"></div></div>
        <div data-g="3">
          <p class="ctl-label"><span class="k" data-t="b.engr"></span> <span style="white-space:nowrap">+30 000</span></p>
          <label class="field"><input id="engr" autocomplete="off" data-ph="b.engrph" placeholder=""><small id="cnt">0 / 12</small></label>
          <label class="check"><input type="checkbox" id="box"> <b data-t="b.box"></b> <span class="pr">+20 000</span></label>
        </div>
      </div>
      <div class="total">
        <div><div class="sum"><small data-t="total"></small><span id="sum">200 000</span> <span class="cur" data-t="cur"></span></div><p data-t="b.approx"></p></div>
        <a class="btn btn-light btn-sm" id="miniGo" href="konstruktor.html"><span data-t="b.send"></span></a>
      </div>
    </div>
  </div>
</section>

<!-- 6. Полоса «с 2016 года» -->
<section class="scr band" id="band" data-name="2016">
  <img class="bg" src="img/shop.jpg" alt="" aria-hidden="true">
  <img class="fl f1" src="img/hat-detail.jpg" alt="" aria-hidden="true">
  <img class="fl f2" src="img/strap-nature.jpg" alt="" aria-hidden="true">
  <img class="fl f3" src="img/emboss.jpg" alt="" aria-hidden="true">
  <div class="band-in">
    <p class="kick" data-t="L.yk"></p>
    <p class="year">2016 — 2026</p>
    <p class="band-t" data-t="L.yt"></p>
  </div>
</section>

<!-- 7. Компании (цветное поле) -->
<section class="scr gifts" id="gifts" data-name="Sovgʻa" data-noen>
  <img class="bg" src="img/table.jpg" alt="" aria-hidden="true">
  <div class="gifts-in">
    <p class="kick" data-t="L.gk"></p>
    <h2 data-t="L.gh"></h2>
    <p class="gt" data-t="L.gt"></p>
    <a class="btn btn-light" data-link="tg" href="#" data-t="L.gc"></a>
  </div>
  <figure class="gift-pic"><img src="img/emboss.jpg" alt="Logotip bosilgan charm hamyon" loading="lazy"></figure>
</section>

<!-- 8. Каталог списком -->
<section class="scr menu" id="menu" data-name="Katalog">
  <div class="menu-in">
    <div class="menu-head"><p class="kick" data-t="L.mk"></p><h2 data-t="L.mh"></h2></div>
    <ul class="mlist">
      <li><img src="img/strap-suede.jpg" alt="" loading="lazy"><b data-t="c.1"></b><i></i><span data-t="c.p1"></span></li>
      <li><img src="img/belt.jpg" alt="" loading="lazy"><b data-t="c.2"></b><i></i><span data-t="L.ask"></span></li>
      <li><img src="img/table.jpg" alt="" loading="lazy"><b data-t="c.3"></b><i></i><span data-t="L.ask"></span></li>
      <li><img src="img/hat-detail.jpg" alt="" loading="lazy"><b data-t="c.5"></b><i></i><span data-t="c.p5"></span></li>
    </ul>
  </div>
</section>

<!-- 9. Адрес -->
<section class="scr visit" id="visit" data-name="Manzil">
  <div class="visit-in">
    <div class="visit-text">
      <p class="kick" data-t="L.vk"></p>
      <h2 data-t="L.vh"></h2>
      <div class="places">
        <div><b data-t="L.vw"></b><span data-t="L.vwv"></span><a class="link" data-link="route-ws" href="#" data-t="L.route" hidden></a><!-- [уточнить у владельца: точная точка на карте — тогда убрать hidden] --></div>
        <div><b data-t="L.vs"></b><span data-t="L.vsv"></span><a class="link" data-link="route-sh" href="#" data-t="L.route" hidden></a></div>
      </div>
      <div class="ctas"><a class="btn btn-primary" data-link="tg" href="#" data-t="L.c2"></a><a class="btn btn-line" data-link="tel" href="#" data-phone></a></div>
    </div>
    <figure class="visit-pic"><img src="img/shop.jpg" alt="El-Nur doʻkoni, Margʻilon" loading="lazy"><figcaption data-t="cap.shop"></figcaption></figure>
  </div>
  <footer class="lfoot"><span data-t="foot.copy"></span><span><a data-link="ig" href="#">Instagram</a> · <a data-link="fb" href="#">Facebook</a> · <a data-link="mail" href="#" data-email></a></span></footer>
</section>
</main>
