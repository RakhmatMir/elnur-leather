    <div class="h-build-text rv">
      <h2 id="bh" data-t="hm.bh"></h2>
      <p data-t="hm.bt"></p>
      <ul class="h-steps">
        <li><b data-t="d.s1b"></b><span data-t="d.s1t"></span></li>
        <li><b data-t="d.s2b"></b><span data-t="d.s2t"></span></li>
        <li><b data-t="d.s3b"></b><span data-t="d.s3t"></span></li>

      <a class="btn btn-light" href="konstruktor.html"><span data-t="d.cta"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <div class="builder rv d1" id="mini" data-ui aria-label="Konstruktor">
      <div class="stage">
        <div class="stage-top"><b data-t="b.title"></b></div>
        <svg id="art" class="art" viewBox="0 0 520 240" role="img" aria-label=""></svg>
        <div>
          <div class="chips" id="chips"></div>
          <p class="disclaimer" data-t="b.disc"></p>
        </div>
      </div>
      <div class="controls">
        <div><p class="ctl-label" data-t="b.item"></p><div class="items" id="items"></div></div>
        <div><p class="ctl-label"><span class="k" data-t="b.leather"></span>: <span id="leatherName"></span></p><div class="swatches" id="leather"></div></div>
        <div><p class="ctl-label"><span class="k" data-t="b.thread"></span>: <span id="threadName"></span></p><div class="swatches" id="thread"></div></div>
        <div>
          <p class="ctl-label"><span class="k" data-t="b.engr"></span> <span style="white-space:nowrap">+30 000</span></p>
          <label class="field"><input id="engr" autocomplete="off" data-ph="b.engrph" placeholder=""><small id="cnt">0 / 12</small></label>
          <label class="check"><input type="checkbox" id="box"> <b data-t="b.box"></b> <span class="pr">+20 000</span></label>
        </div>
      </div>
      <div class="total">
        <div>
          <div class="sum"><small data-t="total"></small><span id="sum">200 000</span> <span class="cur" data-t="cur"></span></div>
          <p data-t="b.approx"></p>
        </div>
        <a class="btn btn-light btn-sm" id="miniGo" href="konstruktor.html"><span data-t="b.send"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </div>
</section>
