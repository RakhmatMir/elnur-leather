<body class="has-bar home inner" data-page="konstruktor" data-langs="uz,ru,en">

<main>
<div class="wrap kb-head">
  <h1 data-t="kb.h1"></h1>
  <p class="lead" data-t="kb.lead"></p>
</div>

<div class="wrap kb" id="kb">
  <div class="kb-stage">
    <div class="stage">
      <div class="stage-top"><b data-t="kb.your"></b><span id="kStepTxt"></span></div>
      <svg id="kArt" class="art" viewBox="0 0 520 240" role="img" aria-label=""></svg>
      <div>
        <div class="chips" id="kChips"></div>
        <p class="disclaimer" data-t="kb.cap"></p>
      </div>
    </div>
  </div>

  <div class="kb-steps">
    <!-- Цены: ремешок «от 200 000» [проверить актуальность]; ремень, кошелёк, картхолдер, гравировка, коробка — заглушки из макета [уточнить у владельца] (js/config.js) -->
    <section class="step" id="stItem">
      <p class="ctl-label" data-t="kb.s1"></p>
      <div class="items" id="kItems"></div>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <section class="step" id="stLeather">
      <p class="ctl-label"><span data-t="kb.s2"></span>: <span id="kLeatherName"></span></p>
      <div class="swatches" id="kLeather"></div>
      <!-- Фразу «Мастер пришлёт фото настоящей кожи» оставить, только если мастер так делает [уточнить у владельца] -->
      <p class="hint" data-t="kb.leatherhint"></p>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <section class="step" id="stThread">
      <p class="ctl-label"><span data-t="kb.s3"></span>: <span id="kThreadName"></span></p>
      <div class="swatches" id="kThread"></div>
      <p class="hint" data-t="kb.threadhint"></p>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <!-- У картхолдера фурнитура скрыта: есть ли она вообще [уточнить у владельца] -->
    <section class="step" id="stHw">
      <p class="ctl-label"><span id="kHwTitle"></span>: <span id="kHwName"></span></p>
      <div class="swatches" id="kHw"></div>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <!-- Размер/модель: ширина ремня и модели картхолдера не известны, шаг для картхолдера скрыт [уточнить у владельца] -->
    <section class="step" id="stSize">
      <p class="ctl-label" id="kSizeTitle"></p>
      <div id="kSize"></div>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <!-- Гравировка: цена, число знаков (12), допустимые символы, способ нанесения [уточнить у владельца] -->
    <section class="step" id="stEngr">
      <p class="ctl-label"><span data-t="kb.s6"></span> <span>+30 000</span></p>
      <label class="check" style="margin-top:0"><input type="checkbox" id="kEngrOn"> <b data-t="kb.engrtoggle"></b></label>
      <div id="kEngrWrap" class="fld" hidden style="margin-top:14px">
        <p class="hint" id="kEngrHint" style="margin:0 0 10px"></p>
        <div id="kEngrFld" class="fld" style="margin:0"><label class="field"><input id="kEngr" autocomplete="off" data-ph="b.engrph" placeholder="" aria-label="Gravirovka"><small id="kCnt">0 / 12</small></label><p class="err" id="kEngrErr"></p></div>
        <p class="hint" data-t="kb.engrnote"></p>
      </div>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button><button class="btn btn-line btn-sm" type="button" data-go="next" data-t="kb.next"></button></div>
    </section>

    <!-- Подарочная коробка: есть ли она и цена [уточнить у владельца] -->
    <section class="step" id="stBox">
      <p class="ctl-label"><span data-t="kb.s7"></span> <span>+20 000</span></p>
      <label class="check" style="margin-top:0"><input type="checkbox" id="kBox"> <b data-t="b.box"></b></label>
      <p class="hint" data-t="kb.boxhint"></p>
      <div class="stepnav"><button class="btn btn-line btn-sm" type="button" data-go="prev" data-t="kb.back"></button></div>
    </section>

    <div class="kb-total" id="kTotal">
      <p class="tt" data-t="kb.your"></p>
      <div class="sum"><small data-t="total"></small><span id="kSum">200 000</span> <span class="cur" data-t="cur"></span></div>
      <p data-t="b.approx"></p>
      <button class="btn btn-light" type="button" id="kSend" data-t="kb.sendbtn"></button>
      <p class="need" id="kNeed" role="alert"></p>
      <button class="share" type="button" id="kShare" data-t="kb.share"></button>
      <p class="msg" id="kMsg" role="status"></p>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="order" id="order" hidden aria-labelledby="oh1" data-formbox>
    <div data-hide-on-ok>
      <h2 id="oh1" data-t="f.title"></h2>
      <p class="sub" data-t="f.sub"></p>
      <div class="summary" id="oSummary"></div>
    </div>
    <form class="form" id="orderForm" data-kind="order" novalidate>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="fld"><label for="o1" data-t="f.name"></label><input id="o1" type="text" name="name" autocomplete="name"><p class="err" data-t="e.name"></p></div>
      <div class="fld"><label for="o2" data-t="f.phone"></label><input id="o2" type="tel" name="phone" autocomplete="tel" placeholder="+998 __ ___ __ __"><p class="err" data-t="e.phone"></p></div>
      <div class="fld"><span class="lb" data-t="f.contact"></span>
        <div class="pills">
          <label class="pill"><input type="radio" name="contact" value="tg" checked><span data-t="f.tg"></span></label>
          <label class="pill"><input type="radio" name="contact" value="call"><span data-t="f.callopt"></span></label>
        </div></div>
      <div class="fld"><label for="o3" data-t="f.city"></label><input id="o3" type="text" name="city" autocomplete="address-level2"></div>
      <div class="fld"><label for="o4" data-t="f.comment"></label><textarea id="o4" name="comment" data-ph="f.commentph"></textarea></div>
      <div class="fld file"><label for="o5" data-t="f.photo"></label><input id="o5" type="file" name="photo" accept="image/*"><p class="err" data-t="e.photo"></p></div>
      <button class="btn btn-primary" type="submit" data-t="f.send"></button>
      <!-- «Заказ ни к чему не обязывает» — подтвердить; если нужна предоплата за гравировку, дописать фразу из тексты.md [уточнить у владельца] -->
      <p class="fine" data-t="f.legal"></p>
      <div class="fail" role="alert">
        <p class="fail-t"></p>
        <div class="row"><a class="btn btn-primary btn-sm tgbtn" href="#" target="_blank" rel="noopener"></a><button type="button" class="btn btn-line btn-sm copy"></button></div>
      </div>
    </form>
    <div class="thanks" role="status">
      <h2 class="th-h"></h2>
      <p class="no th-t"></p>
      <!-- Срок ответа мастера: не показываем, пока владелец не назовёт [уточнить у владельца] -->
      <p class="fine th-s"></p>
      <div class="row"><a class="btn btn-primary" data-link="tg" href="#" data-t="th.tg"></a><a class="btn btn-line" href="index.html" data-t="th.home"></a></div>
    </div>
  </section>
</div>
<section class="wrap kb-real" aria-labelledby="krh">
  <h2 id="krh" class="rv" data-t="hm.krh"></h2>
  <p class="rv" data-t="hm.krt"></p>
  <div class="kr-row">
    <figure class="rv"><img src="img/strap-suede.jpg" width="1280" height="1280" alt="Zamsh soat tasmasi" loading="lazy"><figcaption data-t="s.suede"></figcaption></figure>
    <figure class="rv d1"><img src="img/belt.jpg" width="1280" height="960" alt="Latun toʻqali charm kamar" loading="lazy"><figcaption data-t="c.2"></figcaption></figure>
    <figure class="rv d2"><img src="img/emboss.jpg" width="2000" height="1333" alt="Bosma naqshli charm hamyon" loading="lazy"><figcaption data-t="cap.emboss"></figcaption></figure>
    <figure class="rv d3"><img src="img/strap-nature.jpg" width="1280" height="1280" alt="Perforatsiyali tabiiy rangdagi tasma" loading="lazy"><figcaption data-t="s.nature"></figcaption></figure>
  </div>
</section>
</main>
